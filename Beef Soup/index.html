<!DOCTYPE html>
<html lang="zn-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝牛肉湯嗎</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
    <h1> 🛵 走! 喝牛肉湯 </h1>
    <div class="box">
        <div class="search">
            <span class="icon"><i class="fas fa-search"></i></span>
            <input type="search" id="search" placeholder="Search..."/>
        </div>   
    </div>   
    </header>
    <div class="container">
      <h2>請選擇想要喝牛肉湯的時間段：</h2>
        <div class="day-filters">
          <button class="day-button" data-day="all">全選</button>
          <button class="day-button" data-day="1">一</button>
          <button class="day-button" data-day="2">二</button>
          <button class="day-button" data-day="3">三</button>
          <button class="day-button" data-day="4">四</button>
          <button class="day-button" data-day="5">五</button>
          <button class="day-button" data-day="6">六</button>
          <button class="day-button" data-day="0">日</button>
          <button class="day-button" id="now-button" data-day="all">現在</button>
        </div>
        <div class="time-filters">
          <button class="time-button" data-time="All">全部</button>
          <button class="time-button" data-time="06-12">6–12</button>
          <button class="time-button" data-time="12-18">12–18</button>
          <button class="time-button" data-time="18-24">18–24</button>
          <button class="time-button" data-time="00-06">24–06</button>
          <button class="time-button" data-time="24hr">24小時</button>
        </div>
      <div id="store-list" class="store-list"></div>
    </div>
   <script>
  let stores = [];
  let selectedDay = "all";
  let selectedTime = "All";

  function getOpeningStatusForCurrentView(opening_hours) {
    const now = new Date();
    const nowDecimal = now.getHours() + now.getMinutes() / 60;
    const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const targetKey = selectedDay === "all"
      ? dayKeys[now.getDay()]
      : dayKeys[Number(selectedDay)];

    const slots = opening_hours?.[targetKey];

    if (!Array.isArray(slots) || slots.length === 0) {
      return {
        open: false,
        label: "❌ 公休",
        timeText: "無營業時段"
      };
    }

    const isOpen = slots.some(range => {
      if (typeof range !== "string") return false;
      const [start, end] = range.split("-").map(t => {
        const [h, m] = t.split(":").map(Number);
        return h + (m || 0) / 60;
      });
      return end < start
        ? nowDecimal >= start || nowDecimal < end
        : nowDecimal >= start && nowDecimal < end;
    });

    return {
      open: isOpen,
      label: isOpen ? "✅ 營業中" : "❌ 休息中",
      timeText: slots
        .filter(r => typeof r === "string" && r.includes("-"))
        .map(r => r.replace("-", "–"))
        .join("、")
    };
  }

  function renderStores(filteredStores) {
    const storeList = document.getElementById('store-list');

    if (filteredStores.length === 0) {
      storeList.innerHTML = "<p>找不到符合條件的店家</p>";
      return;
    }

    storeList.innerHTML = filteredStores.map(store => {
      const { label, timeText } = getOpeningStatusForCurrentView(store.opening_hours);

      return `
        <div class="store-card">
          <h3>${store.name}</h3>
          <p class="address">📍 ${store.address || "地址未提供"}</p>
          <p>⏰ 營業時段：${timeText}<br>${label}</p>
          <div class="map">${store.mapEmbed}</div>
        </div>
      `;
    }).join('');
  }

  function filterAndRender() {
    const now = new Date();
    const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const targetKey = selectedDay === "all"
      ? dayKeys[now.getDay()]
      : dayKeys[Number(selectedDay)];

      console.log("🟡 [Debug] selectedDay:", selectedDay);
  console.log("🟡 [Debug] selectedTime:", selectedTime);
  console.log("🟡 [Debug] targetKey:", targetKey);

    const filtered = stores.filter(store => {
      const hours = store.opening_hours?.[targetKey];
      console.log("🔍 檢查店家：", store.name, "→", targetKey, ":", hours);
      if (!hours || hours.length === 0) return false;

      if (selectedTime === "All") return true;
      if (selectedTime === "24hr") {
        return hours.includes("00:00-24:00");
      }

      return hours.some(range => {
        const [startStr, endStr] = range.split("-");
        const [sHour, sMin] = startStr.split(":").map(Number);
        const [eHour, eMin] = endStr.split(":").map(Number);

        const start = sHour + sMin / 60;
        const end = eHour + eMin / 60;
        const [selStart, selEnd] = selectedTime.split("-").map(Number);
        const crossesMidnight = end < start;

        return crossesMidnight
          ? (start < selEnd || end > selStart)
          : (start < selEnd && end > selStart);
      });
    });

    renderStores(filtered);
  }

  fetch("stores.json")
    .then(res => res.json())
    .then(data => {
      stores = data;
      renderStores(stores);

      // 星期按鈕（含「現在」）
      document.querySelectorAll('.day-button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.day-button').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          selectedDay = button.dataset.day;

          if (button.id === "now-button") {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) selectedTime = "06-12";
            else if (hour >= 12 && hour < 18) selectedTime = "12-18";
            else if (hour >= 18 && hour < 24) selectedTime = "18-24";
            else selectedTime = "00-06";

            // 同步高亮時段按鈕
            document.querySelectorAll('.time-button').forEach(btn => {
              btn.classList.toggle('active', btn.dataset.time === selectedTime);
            });
          }

          filterAndRender();
        });
      });

      // 時段按鈕
      document.querySelectorAll('.time-button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.time-button').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          selectedDay = button.dataset.day || "all"; // 現在按鈕會 fallback 成 "all"
          filterAndRender();
        });
      });
    });
</script>



</body>
</html>
