<!DOCTYPE html>
<html lang="zn-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝牛肉湯嗎</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
    <h1> 🛵 走! 喝牛肉湯 </h1>
    <div class="box">
        <div class="search">
            <span class="icon"><i class="fas fa-search"></i></span>
            <input type="search" id="search" placeholder="Search..."/>
        </div>   
    </div>   
    </header>
    <div class="container">
      <h2>請選擇想要喝牛肉湯的時間段：</h2>
        <div class="day-filters">
          <button class="day-button" data-day="all">全選</button>
          <button class="day-button" data-day="1">一</button>
          <button class="day-button" data-day="2">二</button>
          <button class="day-button" data-day="3">三</button>
          <button class="day-button" data-day="4">四</button>
          <button class="day-button" data-day="5">五</button>
          <button class="day-button" data-day="6">六</button>
          <button class="day-button" data-day="0">日</button>
          <button class="day-button" id="now-button" data-day="all">現在</button>
        </div>
        <div class="time-filters">
          <button class="time-button" data-time="All">全部</button>
          <button class="time-button" data-time="06-12">6–12</button>
          <button class="time-button" data-time="12-18">12–18</button>
          <button class="time-button" data-time="18-24">18–24</button>
          <button class="time-button" data-time="00-06">24–06</button>
          <button class="time-button" data-time="24hr">24小時</button>
        </div>
      <div id="store-list" class="store-list"></div>
    </div>
   <script>
let stores = [];
let selectedDay = "all";
let selectedTime = "All";

function getOpeningStatusForCurrentView(opening_hours, selectedDay) {
  const now = new Date();
  const nowDecimal = now.getHours() + now.getMinutes() / 60;
  const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const targetKey = selectedDay === "all"
    ? dayKeys[now.getDay()]
    : dayKeys[Number(selectedDay)];

  const slots = opening_hours?.[targetKey];

  if (!Array.isArray(slots) || slots.length === 0) {
    return {
      open: false,
      label: "❌ 公休",
      timeText: "無營業時段"
    };
  }

  const isOpen = slots.some(range => {
    if (typeof range !== "string") return false;
    const [start, end] = range.split("-").map(t => {
      const [h, m] = t.split(":").map(Number);
      return h + (m || 0) / 60;
    });
    return end < start
      ? nowDecimal >= start || nowDecimal < end
      : nowDecimal >= start && nowDecimal < end;
  });

  return {
    open: isOpen,
    label: isOpen ? "✅ 目前營業中" : "❌ 現在休息中",
    timeText: slots
      .filter(r => typeof r === "string" && r.includes("-"))
      .map(r => r.replace("-", "–"))
      .join("、")
  };
}

function renderStores(filteredStores) {
  const storeList = document.getElementById('store-list');

  if (filteredStores.length === 0) {
    storeList.innerHTML = "<p class='no-result'>找不到符合條件的店家</p>";
    return;
  }

  filteredStores.sort((a, b) => {
    const aOpen = getOpeningStatusForCurrentView(a.opening_hours, selectedDay).open ? -1 : 1;
    const bOpen = getOpeningStatusForCurrentView(b.opening_hours, selectedDay).open ? -1 : 1;
    return aOpen - bOpen;
  });

  storeList.innerHTML = filteredStores.map(store => {
    const { label, timeText } = getOpeningStatusForCurrentView(store.opening_hours, selectedDay);

    return `
      <div class="store-card">
        <h3>${store.name}</h3>
        <p>📍 ${store.address || "地址未提供"}<br>
           ⏰ 營業時段：${timeText}<br>
           ${label}<br>
           ${store.note ? `💬 備註：${store.note}` : ""}
        </p>
        <div class="map">${store.mapEmbed}</div>
      </div>
    `;
  }).join('');
}

function filterAndRender() {
  const now = new Date();
  const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const targetKeys = selectedDay === "all"
    ? dayKeys
    : [dayKeys[Number(selectedDay)]];

  const keyword = document.getElementById("search").value.trim().toLowerCase();

  const filtered = stores.filter(store => {
    if (keyword && !store.name.toLowerCase().includes(keyword)) return false;

    const allHours = targetKeys.map(day => store.opening_hours?.[day] || []).flat();
    if (allHours.length === 0) return false;

    if (selectedTime === "All") return true;

    if (selectedTime === "24hr") {
      return allHours.some(h => h.trim() === "00:00-24:00");
    }

    let [selStart, selEnd] = selectedTime.split("-").map(Number);
    if (selEnd <= selStart) selEnd += 24;

    return allHours.some(range => {
      if (typeof range !== "string" || !range.includes("-")) return false;

      const [startStr, endStr] = range.split("-");
      const [sHour, sMin] = startStr.split(":").map(Number);
      const [eHour, eMin] = endStr.split(":").map(Number);
      let start = sHour + (sMin || 0) / 60;
      let end = eHour + (eMin || 0) / 60;

      if (end <= start) end += 24;

      return start < selEnd && end > selStart;
    });
  });

  renderStores(filtered);
}

fetch("stores.json")
  .then(res => res.json())
  .then(data => {
    stores = data;
    renderStores(stores);
    document.getElementById("search").addEventListener("input", filterAndRender);

    document.querySelectorAll('.day-button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.day-button').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        selectedDay = button.dataset.day;

        if (button.id === "now-button") {
          const hour = new Date().getHours();
          if (hour >= 6 && hour < 12) selectedTime = "06-12";
          else if (hour >= 12 && hour < 18) selectedTime = "12-18";
          else if (hour >= 18 && hour < 24) selectedTime = "18-24";
          else selectedTime = "00-06";

          document.querySelectorAll('.time-button').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.time === selectedTime);
          });

          const today = new Date().getDay(); // 0～6
          document.querySelectorAll('.day-button').forEach(btn => {
            btn.classList.remove('active');
          });
          document.querySelector(`.day-button[data-day="${today}"]`)?.classList.add('active');

          selectedDay = "all"; // 讓 getOpeningStatus 用今天
        }

        filterAndRender();
      });
    });

    document.querySelectorAll('.time-button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.time-button').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        selectedTime = button.dataset.time;
        filterAndRender();
      });
    });

    // ✅ 預設亮起「全選」與「全部」
    document.querySelector('.day-button[data-day="all"]')?.classList.add('active');
    document.querySelector('.time-button[data-time="All"]')?.classList.add('active');

    // ✅ 預設顯示全部
    filterAndRender();
  });
</script>



</body>
</html>
