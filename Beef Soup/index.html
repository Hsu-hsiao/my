<!DOCTYPE html>
<html lang="zn-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝牛肉湯嗎</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
    <h1> 🛵 走! 喝牛肉湯 </h1>
    <div class="box">
        <div class="search">
            <span class="icon"><i class="fas fa-search"></i></span>
            <input type="search" id="search" placeholder="Search..."/>
        </div>   
    </div>   
    </header>
    <div class="container">
      <h2>請選擇想要喝牛肉湯的時間段：</h2>
        <div class="time-filters">
        <button class="time-button" data-time="All">全部</button>
        <button class="time-button" data-time="06-12">6–12</button>
        <button class="time-button" data-time="12-18">12–18</button>
        <button class="time-button" data-time="18-24">18–24</button>
        <button class="time-button" data-time="00-06">24–06</button>
        <button class="time-button" data-time="24hr">24小時</button>
    </div>
    <div id="store-list" class="store-list"></div>
    </div>
    <script>
let stores = [];

fetch('stores.json')
  .then(response => response.json())
  .then(data => {
    stores = data;
    renderStores(stores);

    
function renderStores(filteredStores) 
{
  const storeList = document.getElementById('store-list');

  if (filteredStores.length === 0) {
    storeList.innerHTML = "<p class='no-result'>找不到符合條件的店家</p>";
    return;
  }

  storeList.innerHTML = filteredStores.map(store => `
    <div class="store-card">     
      <div class="store-info">
        <h3>${store.name}</h3>
        <p class="address">📍 ${store.address}</p>
        <p class="time">⏰ 營業時間：${store.open === "00:00" && store.close === "24:00"
        ? "24 小時營業"
        : `${store.open}–${store.close}`}</p>

        <div class="map">${store.mapEmbed}</div>
      </div>
    </div>
  `).join('');
}

// 預設顯示全部
renderStores(stores);

// 按鈕互動
const timeButtons = document.querySelectorAll('.time-button');

timeButtons.forEach(button => {
  button.addEventListener('click', () => {
    // 切換 active 樣式
    timeButtons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    const selectedTime = button.dataset.time;

    const filtered =
      selectedTime === "All"
        ? stores
        : stores.filter(store => {
            const openTime = parseFloat(store.open.replace(":", "."));
            const closeTime = parseFloat(store.close.replace(":", "."));
            const [start, end] = selectedTime.split("-").map(str => parseFloat(str));
            return openTime < end && closeTime > start;
          });

    renderStores(filtered); // 👉 呼叫更新畫面
  });
});

})
</script>


</body>
</html>
